<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — PIQ3D</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/public/logo/extrusor_white.png">
<link rel="stylesheet" href="/public/fonts/fonts.css?v=1">
<!-- nginx la sirve como error_page para CUALQUIER ruta inexistente, a la
     profundidad que sea: por eso todas las rutas son absolutas. Estilos en
     linea por lo mismo que las paginas legales (el .css se cachea un año). -->
<style>
:root{--dark:#0a0a0a;--light:#f5f5f5;--grey-2:#949494;--gutter:24px;
--font:"Archivo",system-ui,sans-serif;--font-display:"Anton","Archivo",system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--dark)}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--dark);color:var(--light);
font-family:var(--font);font-size:clamp(16px,1.25vw,18px);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px var(--gutter)}
.top img{display:block;height:56px;width:auto}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1440px;width:100%;margin:0 auto;padding:48px var(--gutter) 64px}
.etiqueta{align-self:flex-start;margin:0 0 24px;padding:4px 10px;background:var(--light);color:var(--dark);
font-weight:800;font-stretch:78%;text-transform:uppercase;font-size:14px;letter-spacing:.02em}
h1{font-family:var(--font-display);font-weight:400;text-transform:uppercase;font-size:min(15vw,190px);line-height:.84;margin:0 0 28px}
p{max-width:560px;margin:0 0 40px;color:var(--grey-2)}
nav{display:flex;flex-wrap:wrap;gap:8px 28px}
nav a{text-decoration:none;font-weight:800;font-stretch:78%;text-transform:uppercase;font-size:clamp(16px,1.66vw,24px)}
nav a:hover{text-decoration:underline;text-underline-offset:4px}
@media (max-width:640px){:root{--gutter:16px}.top img{height:44px}}
</style>
</head>
<body>
<header class="top">
  <a href="/" aria-label="PIQ3D inicio"><img src="/public/logo/logo_white.png" alt="PIQ3D" width="1783" height="1417" style="width:auto"></a>
</header>
<main>
  <p class="etiqueta">Error 404</p>
  <h1>Esta página<br>no existe</h1>
  <p>La dirección que has abierto no está en piq3d.com, o ha cambiado de sitio. Desde la portada llegas a todo lo que hacemos.</p>
  <nav aria-label="Secciones">
    <a href="/">Inicio</a>
    <a href="/#trabajos">Trabajos</a>
    <a href="/#especialidades">Especialidades</a>
    <a href="/galeria/">Galería</a>
    <a href="/#contacto">Contacto</a>
  </nav>
</main>
</body>
</html>
