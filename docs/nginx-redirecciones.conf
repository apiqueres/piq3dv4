# ============================================================
#  Redirecciones 301 para piq3d.com (nginx).
#  Pegar DENTRO del bloque `server { ... }` de piq3d.com, antes del
#  `location / { try_files ... }`. Después: nginx -t && systemctl reload nginx
#
#  Origen: URL de la web antigua que Search Console reporta como 404
#  (6 oct 2026). Si aparecen más en el informe "No se encuentra (404)",
#  añadir una línea por cada una siguiendo el mismo patrón.
# ============================================================

# /index.html es un duplicado de la portada
location = /index.html { return 301 https://piq3d.com/; }

# Secciones de la web antigua -> páginas nuevas
location ~ ^/trofeos/?$                  { return 301 https://piq3d.com/trofeos-personalizados/; }
location ~ ^/medallas/?$                 { return 301 https://piq3d.com/medallas-personalizadas/; }
location ~ ^/llaveros/?$                 { return 301 https://piq3d.com/llaveros-personalizados/; }
location ~ ^/productos/?$                { return 301 https://piq3d.com/trofeos-personalizados/; }
location ~ ^/personaliza-tu-mascota/?$   { return 301 https://piq3d.com/impresion-3d-personalizada/; }

# Páginas antiguas que ahora son secciones de la portada
location ~ ^/contacto/?$                 { return 301 https://piq3d.com/#contacto; }
location ~ ^/encarganos-tu-pedido/?$     { return 301 https://piq3d.com/#contacto; }
location ~ ^/nosotros/?$                 { return 301 https://piq3d.com/#nosotros; }
