<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIQ3D loader</title>
<style>
:root{--bg:#0a0a0a;--fg:#f5f5f5}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Archivo,system-ui,sans-serif}
#loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100;transition:transform .9s cubic-bezier(.76,0,.24,1)}
#loader.done{transform:translateY(-100%)}
.logo{position:relative;width:min(62vw,560px);aspect-ratio:1783/1417}
.logo img{position:absolute;display:block;height:auto;opacity:0;transform:translateY(60%);will-change:transform,opacity}
/* posiciones relativas al bbox del logo (public/logo/pieces.json) */
.p{left:0;top:20.4%;width:23.95%}
.e{left:20.8%;top:0;width:26.64%}
.q{left:40.83%;top:24.7%;width:23.95%}
.n3{left:59.9%;top:20.96%;width:19.46%}
.d{left:75.83%;top:20.96%;width:24.17%}
/* 1) entrada: cada letra salta desde abajo, una tras otra */
.logo img{animation:enter .7s cubic-bezier(.2,1.4,.4,1) forwards, bounce 1.6s ease-in-out 1.1s infinite}
.p{animation-delay:0s,1.1s}.e{animation-delay:.14s,1.24s}.q{animation-delay:.28s,1.38s}.n3{animation-delay:.42s,1.52s}.d{animation-delay:.56s,1.66s}
@keyframes enter{0%{opacity:0;transform:translateY(60%)}60%{opacity:1;transform:translateY(-10%)}100%{opacity:1;transform:translateY(0)}}
/* 2) bucle "ola" mientras carga: salto corto encadenado */
@keyframes bounce{0%,35%,100%{transform:translateY(0)}12%{transform:translateY(-14%) scaleY(1.05)}22%{transform:translateY(0) scaleY(.96)}}
.bar{position:absolute;left:50%;bottom:9vh;width:120px;height:2px;background:#333;transform:translateX(-50%);overflow:hidden}
.bar i{position:absolute;inset:0;background:var(--fg);transform-origin:left;transform:scaleX(0);transition:transform .25s linear}
main{min-height:100vh;display:grid;place-items:center;text-align:center}
button{margin-top:1rem;background:none;border:1px solid var(--fg);color:var(--fg);padding:.6rem 1.2rem;font:inherit;cursor:pointer;border-radius:999px}
@media (prefers-reduced-motion:reduce){.logo img{animation:none;opacity:1;transform:none}}
</style></head><body>
<div id="loader" aria-label="Cargando PIQ3D">
  <div class="logo">
    <img class="p" src="public/logo/P_white.png" alt="">
    <img class="e" src="public/logo/extrusor_white.png" alt="">
    <img class="q" src="public/logo/Q_white.png" alt="">
    <img class="n3" src="public/logo/3_white.png" alt="">
    <img class="d" src="public/logo/D_white.png" alt="">
  </div>
  <div class="bar"><i></i></div>
</div>
<main><div><h1>PIQ3D</h1><p>Demo del loader: las letras entran saltando una tras otra y luego hacen una ola hasta que la página termina de cargar.</p><button onclick="replay()">Repetir</button></div></main>
<script>
const loader=document.getElementById('loader'),bar=loader.querySelector('.bar i');
function run(){
  loader.classList.remove('done');
  let p=0;const t=setInterval(()=>{p=Math.min(100,p+Math.random()*18);bar.style.transform=`scaleX(${p/100})`;if(p>=100){clearInterval(t);setTimeout(()=>loader.classList.add('done'),400)}},180);
}
function replay(){loader.querySelectorAll('img').forEach(i=>{i.style.animation='none';i.offsetHeight;i.style.animation=''});bar.style.transform='scaleX(0)';run()}
window.addEventListener('load',run);
</script></body></html>
